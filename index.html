<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="ch-api" content="https://cardhound-api.onrender.com">
<meta name="apple-mobile-web-app-title" content="CardHound">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' blob: https://cardhound-api.onrender.com; media-src 'self' blob:; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CardHound</title>
<meta name="description" content="CardHound friends beta. Sample prices only.">
<link rel="icon" href="live/icon-192.png"><link rel="apple-touch-icon" href="live/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="live/live.css">
<link rel="stylesheet" href="beta/beta.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar" id="topbar">
    <a class="brand" href="#/scan" aria-label="CardHound home">
      <span class="mono" aria-hidden="true">CH</span>
      <span class="wordmark">CardHound</span>
    </a>
    <div class="topbar-right">
      <span class="badge-sample bt-pill" title="Every price in the beta is made-up sample data" aria-label="Sample prices"><i></i>Sample prices</span>
      <button class="icon-btn" id="btn-settings" aria-label="Connections and settings"></button>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="sheet-root"></div>
<input id="lv-photo" type="file" accept="image/*" capture="environment" hidden aria-hidden="true">
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="boom-root" aria-live="assertive"></div>
<script src="data/sample.js"></script>
<script src="js/config.js"></script>
<script src="js/connections.config.js"></script>
<script src="js/data/adapter.js"></script>
<script src="js/data/local-ledger.js"></script>
<script src="js/data/local-alerts.js"></script>
<script src="js/data/local-hunts.js"></script>
<script src="js/data/sample-adapter.js"></script>
<script src="js/data/cardladder-user-adapter.js"></script>
<script src="js/data/file-import-adapter.js"></script>
<script src="js/data/licensed-feed-adapter.js"></script>
<script src="js/icons.js"></script>
<script src="js/ledger.js"></script>
<script src="js/boom.js"></script>
<script src="js/voice-parse.js"></script>
<script src="js/voice.js"></script>
<script src="beta/beta-pre.js"></script>
<script src="live/live.js"></script>
<script src="beta/beta.js"></script>
<script src="js/app.js"></script>
</body>
</html>
